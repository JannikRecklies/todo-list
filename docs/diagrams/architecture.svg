<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
      <title id="architecture-title">Todo list architecture</title>
      <desc id="architecture-desc">The browser loads the React app, which would call the Express server; that call is not built yet.</desc>
      <defs>
      <style>#architecture-root .diagram-container { width: 100%; max-width: 900px; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows (drawn before boxes) -->
      <line x1="220" y1="120" x2="310" y2="120" stroke="#4f5d75" stroke-width="2" marker-end="url(#architecture-arrow)"/>
      <rect x="236" y="96" width="58" height="16" fill="#f5f5f5"/>
      <text x="265" y="108" text-anchor="middle" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">LOADS</text>

      <line x1="490" y1="120" x2="580" y2="120" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#architecture-arrow)"/>
      <rect x="506" y="96" width="58" height="16" fill="#f5f5f5"/>
      <text x="535" y="108" text-anchor="middle" fill="#4f5d75" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">NOT YET</text>

      <!-- Browser -->
      <rect x="40" y="80" width="180" height="80" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="130" y="116" text-anchor="middle" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif">Browser</text>
      <text x="130" y="140" text-anchor="middle" fill="#5a6580" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">localhost:3000</text>

      <!-- React (focal) -->
      <rect x="310" y="80" width="180" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="310" y="80" width="180" height="80" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/>
      <text x="400" y="116" text-anchor="middle" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif">React</text>
      <text x="400" y="140" text-anchor="middle" fill="#5a6580" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">Todo list UI</text>

      <!-- Express -->
      <rect x="580" y="80" width="180" height="80" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="670" y="116" text-anchor="middle" fill="#2d3142" font-size="20" font-weight="600" font-family="'Geist', system-ui, sans-serif">Express</text>
      <text x="670" y="140" text-anchor="middle" fill="#5a6580" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">localhost:3001</text>
    </svg>
