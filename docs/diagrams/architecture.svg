<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Todo list architecture</title>
        <desc id="architecture-desc">The browser loads the React frontend, where TodoLists opens into TodoListForm; TodoListForm would call the Express backend, but that call is not built yet, and the backend only serves GET /.</desc>
        <defs>
      <style>#architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="220" y="60" width="320" height="320" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="232" y="66" width="168" height="18" rx="2" fill="#f5f5f5"/>
        <text x="238" y="79" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">FRONTEND · :3000</text>

        <rect x="580" y="60" width="200" height="320" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.12"/>
        <rect x="592" y="66" width="168" height="18" rx="2" fill="#f5f5f5"/>
        <text x="598" y="79" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">BACKEND · :3001</text>

        <!-- Arrows (drawn before nodes) -->
        <line x1="174" y1="160" x2="240" y2="160" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#architecture-arrow)"/>
        <rect x="180" y="140" width="54" height="14" fill="#f5f5f5"/>
        <text x="207" y="151" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">LOADS</text>

        <line x1="380" y1="200" x2="380" y2="270" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#architecture-arrow)"/>
        <rect x="388" y="229" width="54" height="14" fill="#f5f5f5"/>
        <text x="392" y="240" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">OPENS</text>

        <line x1="520" y1="310" x2="596" y2="310" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#architecture-arrow)"/>
        <rect x="526" y="286" width="64" height="14" fill="#f5f5f5"/>
        <text x="558" y="297" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">NOT YET</text>

        <!-- Browser -->
        <rect x="24" y="120" width="150" height="80" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <text x="40" y="152" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Browser</text>
        <text x="40" y="174" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">localhost:3000</text>

        <!-- TodoLists -->
        <rect x="240" y="120" width="280" height="80" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <text x="256" y="152" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">TodoLists</text>
        <text x="256" y="174" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">Shows all lists, click to open</text>

        <!-- TodoListForm (focal) -->
        <rect x="240" y="270" width="280" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="270" width="280" height="80" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/>
        <text x="256" y="302" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">TodoListForm</text>
        <text x="256" y="324" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">Edit, add and delete todos</text>

        <!-- Express server -->
        <rect x="596" y="270" width="168" height="80" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <text x="612" y="302" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Express</text>
        <text x="612" y="324" fill="#5a6580" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">Only GET /</text>

        <!-- Legend strip -->
        <line x1="24" y1="394" x2="56" y2="394" stroke="#4f5d75" stroke-width="1.5"/>
        <text x="64" y="398" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">IMPLEMENTED</text>
        <line x1="200" y1="394" x2="232" y2="394" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="5,4"/>
        <text x="240" y="398" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">NOT YET BUILT</text>
        <rect x="390" y="388" width="14" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/>
        <text x="410" y="398" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">FOCAL COMPONENT</text>
      </svg>
