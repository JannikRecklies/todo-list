<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
      <title id="architecture-title">Todo list architecture</title>
      <desc id="architecture-desc">The browser loads the frontend, which contains TodoLists and TodoListForm; the backend contains an Express app with a GET / route, and the frontend-to-backend call is not built yet.</desc>
      <defs>
      <style>#architecture-root .diagram-container { width: 100%; max-width: 900px; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Containers -->
      <rect x="220" y="30" width="280" height="200" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.14"/>
      <text x="240" y="56" fill="#5a6580" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">FRONTEND · React</text>

      <rect x="600" y="30" width="180" height="200" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.14"/>
      <text x="620" y="56" fill="#5a6580" font-size="13" font-family="'Geist Mono', ui-monospace, monospace">BACKEND · Express</text>

      <!-- Arrows (drawn before boxes) -->
      <line x1="150" y1="130" x2="220" y2="130" stroke="#4f5d75" stroke-width="2" marker-end="url(#architecture-arrow)"/>
      <rect x="160" y="108" width="50" height="16" fill="#f5f5f5"/>
      <text x="185" y="120" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">LOADS</text>

      <line x1="500" y1="130" x2="600" y2="130" stroke="#4f5d75" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#architecture-arrow)"/>
      <rect x="520" y="108" width="60" height="16" fill="#f5f5f5"/>
      <text x="550" y="120" text-anchor="middle" fill="#4f5d75" font-size="12" font-family="'Geist Mono', ui-monospace, monospace">NOT YET</text>

      <!-- Browser -->
      <rect x="20" y="90" width="130" height="80" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="85" y="136" text-anchor="middle" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', system-ui, sans-serif">Browser</text>

      <!-- Frontend components -->
      <rect x="240" y="72" width="240" height="50" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="72" width="240" height="50" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/>
      <text x="360" y="102" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">TodoLists</text>

      <rect x="240" y="142" width="240" height="50" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="360" y="172" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">TodoListForm</text>

      <!-- Backend components -->
      <rect x="620" y="72" width="140" height="50" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="690" y="102" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, sans-serif">Express app</text>

      <rect x="620" y="142" width="140" height="50" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="690" y="172" text-anchor="middle" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace">GET /</text>
    </svg>
