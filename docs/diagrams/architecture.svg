<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Todo list architecture</title>
        <desc id="architecture-desc">A React client runs in the browser and renders todo lists from in-memory mock data, while a separate Express server currently only answers a hello route; the planned client-to-server API call is not built yet.</desc>
        <defs>
      <style>#architecture-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="250" y="100" width="240" height="260" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="262" y="104" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="266" y="113" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CLIENT · :3000</text>

        <rect x="580" y="100" width="240" height="120" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
        <rect x="592" y="104" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="596" y="113" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SERVER · :3001</text>

        <!-- Arrows (drawn before nodes) -->
        <line x1="200" y1="160" x2="280" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="218" y="134" width="44" height="14" fill="#f5f5f5"/>
        <text x="240" y="144" text-anchor="middle" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">LOADS</text>

        <line x1="375" y1="190" x2="375" y2="260" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-arrow)"/>
        <rect x="383" y="218" width="44" height="14" fill="#f5f5f5"/>
        <text x="387" y="228" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">CALLS</text>

        <line x1="470" y1="160" x2="600" y2="160" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-arrow)"/>
        <rect x="512" y="134" width="56" height="14" fill="#f5f5f5"/>
        <text x="540" y="144" text-anchor="middle" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">NOT YET</text>

        <!-- Browser user -->
        <rect x="40" y="130" width="160" height="60" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="52" y="140" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="56" y="149" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">INPUT</text>
        <text x="52" y="170" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif">Browser</text>
        <text x="52" y="182" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">localhost:3000</text>

        <!-- React app (focal) -->
        <rect x="280" y="130" width="190" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="130" width="190" height="60" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <rect x="292" y="140" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="296" y="149" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">COMPONENT</text>
        <text x="292" y="170" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif">React app</text>
        <text x="292" y="182" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">App · TodoLists · TodoListForm</text>

        <!-- Mock data store -->
        <rect x="280" y="260" width="190" height="60" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="292" y="270" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="296" y="279" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">STATE</text>
        <text x="292" y="300" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif">Mock todo lists</text>
        <text x="292" y="312" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">fetchTodoLists() · 1s delay</text>

        <!-- Express server -->
        <rect x="600" y="130" width="190" height="60" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1"/>
        <rect x="612" y="140" width="40" height="12" rx="2" fill="#f5f5f5"/>
        <text x="616" y="149" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">API</text>
        <text x="612" y="170" fill="#2d3142" font-size="13" font-weight="600" font-family="'Geist', system-ui, sans-serif">Express server</text>
        <text x="612" y="182" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">GET / only · no todo routes</text>

        <!-- Legend strip -->
        <line x1="40" y1="402" x2="72" y2="402" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="80" y="405" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">IMPLEMENTED</text>
        <line x1="200" y1="402" x2="232" y2="402" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="240" y="405" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">NOT YET BUILT</text>
        <rect x="380" y="396" width="14" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="402" y="405" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.08em">FOCAL COMPONENT</text>
      </svg>
