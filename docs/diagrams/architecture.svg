<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 136 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
      <title id="architecture-title">Todo list architecture</title>
      <desc id="architecture-desc">The browser loads a React frontend made of TodoLists and TodoListForm; the frontend would call an Express backend that currently only serves GET /, but that call is not built yet.</desc>
      <defs>
      <style>#architecture-root .diagram-container { width: 100%; max-width: 960px; overflow-x: auto; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
        <marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect x="0" y="136" width="960" height="300" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="232" y="160" width="328" height="216" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.14"/>
      <text x="252" y="184" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">FRONTEND · REACT 18</text>

      <rect x="640" y="160" width="288" height="216" rx="8" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.02" stroke-opacity="0.14"/>
      <text x="660" y="184" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">BACKEND · EXPRESS 4</text>

      <!-- Connectors (drawn before nodes) -->
      <line x1="172" y1="228" x2="256" y2="228" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#architecture-arrow)"/>
      <rect x="182" y="204" width="40" height="16" fill="#f5f5f5"/>
      <text x="202" y="216" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">HTTP</text>

      <line x1="396" y1="256" x2="396" y2="300" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#architecture-arrow)"/>
      <rect x="404" y="270" width="48" height="16" fill="#f5f5f5"/>
      <text x="408" y="282" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">OPEN</text>

      <line x1="536" y1="328" x2="664" y2="328" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="6,5" marker-end="url(#architecture-arrow)"/>
      <rect x="572" y="308" width="56" height="16" fill="#f5f5f5"/>
      <text x="600" y="320" text-anchor="middle" fill="#4f5d75" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">PLANNED</text>

      <!-- Browser -->
      <rect x="32" y="200" width="140" height="56" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="48" y="224" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Browser</text>
      <text x="48" y="244" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">End user</text>

      <!-- TodoLists -->
      <rect x="256" y="200" width="280" height="56" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="272" y="224" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">TodoLists</text>
      <text x="272" y="244" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Lists overview · sample data</text>

      <!-- TodoListForm (focal) -->
      <rect x="256" y="300" width="280" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="256" y="300" width="280" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/>
      <text x="272" y="324" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">TodoListForm</text>
      <text x="272" y="344" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Edit, add and delete todos</text>

      <!-- Express server -->
      <rect x="664" y="300" width="248" height="56" rx="6" fill="#ececec" stroke="#bfc0c0" stroke-width="1.2"/>
      <text x="680" y="324" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', system-ui, sans-serif">Express server</text>
      <text x="680" y="344" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">Port 3001 · GET / only</text>

      <!-- Legend -->
      <line x1="32" y1="408" x2="64" y2="408" stroke="#4f5d75" stroke-width="1.5"/>
      <text x="72" y="412" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">IMPLEMENTED</text>
      <line x1="200" y1="408" x2="232" y2="408" stroke="#4f5d75" stroke-width="1.5" stroke-dasharray="6,5"/>
      <text x="240" y="412" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">PLANNED, NOT BUILT</text>
      <rect x="420" y="402" width="14" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1.5" fill-opacity="0.08"/>
      <text x="442" y="412" fill="#5a6580" font-size="11" font-family="'Geist Mono', ui-monospace, monospace">FOCAL COMPONENT</text>
    </svg>
