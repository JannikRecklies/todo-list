<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="todo-db-schema-title todo-db-schema-desc" id="todo-db-schema-root">
        <title id="todo-db-schema-title">Todo database schema</title>
        <desc id="todo-db-schema-desc">Three SQLite tables: todo_list, todo, and app_metadata, where todo.list_id references todo_list.id with ON DELETE CASCADE.</desc>
        <defs>
      <style>#todo-db-schema-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #todo-db-schema-root { font-family: var(--font-sans); color: var(--color-ink); }
      #todo-db-schema-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#todo-db-schema-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="todo-db-schema-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="960" height="520" fill="#f5f5f5"/>

        <!-- Foreign key connector first, so table boxes paint over its ends -->
        <path d="M580 168 L380 168" fill="none" stroke="#bf4520" stroke-width="1.5" marker-end="url(#todo-db-schema-arrow-accent)"/>
        <rect x="446" y="147" width="68" height="14" fill="#f5f5f5"/>
        <text x="480" y="157" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#bf4520" letter-spacing="0.08em">CASCADE</text>

        <!-- todo_list -->
        <rect x="60" y="120" width="320" height="116" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="60" y="120" width="320" height="36" rx="6" fill="#ececec"/>
        <line x1="60" y1="156" x2="380" y2="156" stroke="#bfc0c0" stroke-width="1"/>
        <text x="76" y="143" font-family="Geist, sans-serif" font-weight="600" font-size="12" fill="#2d3142">todo_list</text>
        <rect x="318" y="130" width="50" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="343" y="141" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75" letter-spacing="0.12em">TABLE</text>

        <text x="76" y="172" font-family="Geist, sans-serif" font-size="12" fill="#2d3142">id</text>
        <rect x="150" y="162" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="161" y="171" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">PK</text>
        <text x="368" y="172" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">TEXT</text>

        <text x="76" y="196" font-family="Geist, sans-serif" font-size="12" fill="#2d3142">title</text>
        <rect x="150" y="186" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="161" y="195" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">NN</text>
        <text x="368" y="196" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">TEXT</text>

        <text x="76" y="220" font-family="Geist, sans-serif" font-size="12" fill="#2d3142">position</text>
        <rect x="150" y="210" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="161" y="219" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">UQ</text>
        <rect x="176" y="210" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="187" y="219" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">NN</text>
        <text x="368" y="220" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">INTEGER</text>

        <!-- todo (focal: header band only) -->
        <rect x="580" y="120" width="320" height="116" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="580" y="120" width="320" height="36" rx="6" fill="#f1e7e4"/>
        <line x1="580" y1="156" x2="900" y2="156" stroke="#bfc0c0" stroke-width="1"/>
        <text x="596" y="143" font-family="Geist, sans-serif" font-weight="600" font-size="12" fill="#2d3142">todo</text>
        <rect x="838" y="130" width="50" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="863" y="141" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75" letter-spacing="0.12em">TABLE</text>

        <text x="596" y="172" font-family="Geist, sans-serif" font-size="12" fill="#2d3142">list_id</text>
        <rect x="670" y="162" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="681" y="171" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">PK</text>
        <rect x="696" y="162" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="707" y="171" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">FK</text>
        <text x="888" y="172" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">TEXT</text>

        <text x="596" y="196" font-family="Geist, sans-serif" font-size="12" fill="#2d3142">position</text>
        <rect x="670" y="186" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="681" y="195" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">PK</text>
        <text x="888" y="196" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">INTEGER</text>

        <text x="596" y="220" font-family="Geist, sans-serif" font-size="12" fill="#2d3142">text</text>
        <rect x="670" y="210" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="681" y="219" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">NN</text>
        <text x="888" y="220" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">TEXT</text>

        <!-- app_metadata (standalone) -->
        <rect x="60" y="330" width="320" height="92" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
        <rect x="60" y="330" width="320" height="36" rx="6" fill="#ececec"/>
        <line x1="60" y1="366" x2="380" y2="366" stroke="#bfc0c0" stroke-width="1"/>
        <text x="76" y="353" font-family="Geist, sans-serif" font-weight="600" font-size="12" fill="#2d3142">app_metadata</text>
        <rect x="318" y="340" width="50" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="343" y="351" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75" letter-spacing="0.12em">TABLE</text>

        <text x="76" y="382" font-family="Geist, sans-serif" font-size="12" fill="#2d3142">key</text>
        <rect x="150" y="372" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="161" y="381" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">PK</text>
        <text x="368" y="382" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">TEXT</text>

        <text x="76" y="406" font-family="Geist, sans-serif" font-size="12" fill="#2d3142">value</text>
        <rect x="150" y="396" width="22" height="12" rx="2" fill="#f5f5f5" stroke="#bfc0c0"/>
        <text x="161" y="405" text-anchor="middle" font-family="Geist Mono, monospace" font-size="8" fill="#4f5d75">NN</text>
        <text x="368" y="406" text-anchor="end" font-family="Geist Mono, monospace" font-size="9" fill="#5a6580">TEXT</text>

        <text x="420" y="384" font-family="Geist, sans-serif" font-size="9" fill="#5a6580">Standalone. Stores the sample-seed flag and has no foreign keys.</text>

        <line x1="40" y1="462" x2="920" y2="462" stroke="#bfc0c0" stroke-width="1"/>
        <text x="40" y="482" font-family="Geist, sans-serif" font-size="9" fill="#5a6580">PK primary key · FK foreign key · UQ unique · NN not null · Accent: deleting a list cascades to its todo rows.</text>
        <text x="40" y="500" font-family="Geist, sans-serif" font-size="9" fill="#5a6580">Not drawn: CHECK (length(trim(title)) &gt; 0) on todo_list.title.</text>
      </svg>
