<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo list architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #5a6580;
      --rule: #bfc0c0;
      --accent: #bf4520;
      --link: #2e5aa8;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', Georgia, serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(1rem, 4vw, 3rem);
    }
    .frame { width: 100%; max-width: 1280px; min-width: 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 1280px; display: block; }
    .screen-reader-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
    }
    .diagram-title {
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 400;
      fill: var(--ink);
    }
    .zone-label, .tag-label, .arrow-label {
      font-family: var(--font-mono);
      font-size: 8px;
      fill: var(--soft);
    }
    .zone-label { font-weight: 500; letter-spacing: 0.14em; }
    .tag-label { font-weight: 500; letter-spacing: 0.12em; }
    .arrow-label { letter-spacing: 0.06em; }
    .node-name {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      fill: var(--ink);
    }
    .technical {
      font-family: var(--font-mono);
      font-size: 9px;
      fill: var(--soft);
    }
    .detail, .subtitle {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 400;
      fill: var(--muted);
    }
    .note-heading {
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      fill: var(--ink);
    }
    .fine-print {
      font-family: var(--font-sans);
      font-size: 9px;
      font-weight: 400;
      fill: var(--muted);
    }
    .network-label { fill: var(--link); }
    .focal-label { fill: var(--accent); }
    .connector {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.2;
    }
    .network-connector { stroke: var(--link); }
    @media (max-width: 600px) {
      body { align-items: flex-start; }
    }
    @media print {
      body { padding: 0; min-height: 0; }
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1 class="screen-reader-only">Todo list architecture</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
        <title id="architecture-title">Todo list architecture</title>
        <desc id="architecture-desc">React components call a browser-side HTTP client, which sends JSON requests to Express; the backend validates requests and uses a store module to persist one shared collection in a server-local SQLite file.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="1280" height="720" fill="#f5f5f5"/>
        <text x="40" y="56" class="zone-label">SYSTEM OVERVIEW / TODO LIST</text>
        <text x="40" y="100" class="diagram-title">Todo list architecture</text>
        <text x="40" y="128" class="subtitle">The browser edits. The server validates. SQLite persists.</text>

        <rect x="40" y="180" width="408" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="56" y="172" width="144" height="16" rx="2" fill="#f5f5f5"/>
        <text x="64" y="183" class="zone-label">BROWSER / FRONTEND</text>
        <text x="64" y="212" class="technical">React 18 / localhost:3000</text>

        <rect x="520" y="180" width="408" height="320" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
        <rect x="536" y="172" width="144" height="16" rx="2" fill="#f5f5f5"/>
        <text x="544" y="183" class="zone-label">NODE.JS / BACKEND</text>
        <text x="544" y="212" class="technical">Express 4 / localhost:3001</text>
        <text x="1000" y="212" class="zone-label">ON THE SERVER'S DISK</text>

        <line x1="224" y1="336" x2="264" y2="336" class="connector" marker-end="url(#arrow)"/>
        <line x1="424" y1="336" x2="544" y2="336" class="connector network-connector" marker-end="url(#arrow-link)"/>
        <line x1="704" y1="336" x2="744" y2="336" class="connector" marker-end="url(#arrow)"/>
        <line x1="904" y1="336" x2="1000" y2="336" class="connector" marker-end="url(#arrow)"/>

        <rect x="448" y="316" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="484" y="325" text-anchor="middle" class="arrow-label network-label">HTTP / JSON</text>
        <rect x="936" y="316" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="952" y="325" text-anchor="middle" class="arrow-label">SQL</text>

        <g class="node" data-node-id="react-ui">
          <rect x="64" y="236" width="160" height="200" rx="6" fill="#f5f5f5"/>
          <rect class="node-box" x="64" y="236" width="160" height="200" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
          <rect x="80" y="252" width="32" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8"/>
          <text x="96" y="263" text-anchor="middle" class="tag-label">UI</text>
          <text x="80" y="296" class="node-name">React UI</text>
          <text x="80" y="318" class="technical">TodoLists.jsx</text>
          <text x="80" y="334" class="technical">TodoListForm.jsx</text>
          <line x1="80" y1="356" x2="208" y2="356" stroke="#bfc0c0" stroke-width="0.8"/>
          <text x="80" y="382" class="detail">Manage lists</text>
          <text x="80" y="400" class="detail">Edit title + todos</text>
        </g>

        <g class="node" data-node-id="http-client">
          <rect x="264" y="280" width="160" height="112" rx="6" fill="#f5f5f5"/>
          <rect class="node-box" x="264" y="280" width="160" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="280" y="296" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8"/>
          <text x="304" y="307" text-anchor="middle" class="tag-label">CLIENT</text>
          <text x="280" y="340" class="node-name">HTTP client</text>
          <text x="280" y="360" class="technical">api.js / fetch()</text>
        </g>

        <g class="node" data-node-id="express-api">
          <rect x="544" y="256" width="160" height="160" rx="6" fill="#f5f5f5"/>
          <rect class="node-box" x="544" y="256" width="160" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <rect x="560" y="272" width="32" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8"/>
          <text x="576" y="283" text-anchor="middle" class="tag-label">API</text>
          <text x="560" y="320" class="node-name">Express API</text>
          <text x="560" y="344" class="technical">todoListRoutes.js</text>
          <text x="560" y="362" class="technical">/api/todo-lists</text>
          <text x="560" y="392" class="detail">Validate + CRUD</text>
        </g>

        <g class="node" data-node-id="todo-list-store">
          <rect x="744" y="276" width="160" height="120" rx="6" fill="#f5f5f5"/>
          <rect class="node-box" x="744" y="276" width="160" height="120" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
          <rect x="760" y="292" width="48" height="16" rx="2" fill="#f5f5f5" stroke="#bfc0c0" stroke-width="0.8"/>
          <text x="784" y="303" text-anchor="middle" class="tag-label">STORE</text>
          <text x="760" y="336" class="node-name">Todo list store</text>
          <text x="760" y="356" class="technical">todoListStore.js</text>
          <text x="760" y="374" class="technical">better-sqlite3</text>
        </g>

        <g class="node" data-node-id="sqlite">
          <rect x="1000" y="236" width="240" height="200" rx="6" fill="#f5f5f5"/>
          <rect class="node-box" x="1000" y="236" width="240" height="200" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
          <rect x="1016" y="252" width="56" height="16" rx="2" fill="#f5f5f5" stroke="#bf4520" stroke-width="0.8"/>
          <text x="1044" y="263" text-anchor="middle" class="tag-label focal-label">SQLITE</text>
          <text x="1016" y="300" class="node-name">SQLite database</text>
          <text x="1016" y="320" class="technical">backend/data/</text>
          <text x="1016" y="338" class="technical">todo-lists.sqlite</text>
          <line x1="1016" y1="356" x2="1224" y2="356" stroke="#bfc0c0" stroke-width="0.8"/>
          <text x="1016" y="382" class="detail">One shared collection</text>
          <text x="1016" y="400" class="detail">Survives refresh + restart</text>
        </g>

        <text x="64" y="548" class="note-heading">Drafts stay in the browser</text>
        <text x="64" y="572" class="detail">Title and todo edits are sent when Save is pressed.</text>
        <text x="64" y="592" class="fine-print">Creating or deleting a list sends a request immediately.</text>

        <text x="544" y="548" class="note-heading">The server commits the saved list</text>
        <text x="544" y="572" class="detail">The title and todos are replaced in one transaction.</text>
        <text x="544" y="592" class="fine-print">Later saves win. Other browsers see changes on refresh.</text>

        <line x1="40" y1="648" x2="1240" y2="648" stroke="#bfc0c0" stroke-width="0.8"/>
        <line x1="40" y1="676" x2="68" y2="676" class="connector"/>
        <text x="80" y="679" class="fine-print">In-process call / SQL</text>
        <line x1="256" y1="676" x2="284" y2="676" class="connector network-connector"/>
        <text x="296" y="679" class="fine-print">HTTP request</text>
        <rect x="424" y="668" width="16" height="16" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="452" y="679" class="fine-print">Persisted data</text>
        <text x="1240" y="679" text-anchor="end" class="fine-print">Arrows show calls; responses return on the same path.</text>
      </svg>
    </div>
  </main>
</body>
</html>
